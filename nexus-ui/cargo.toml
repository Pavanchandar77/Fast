[package]
name = "nexus-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "glow",
] }
egui = "0.29"
sysinfo = "0.32"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true