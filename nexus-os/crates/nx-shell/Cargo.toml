[package]
name = "nx-shell"
description = "Nexus-OS macOS-grade shell: menu bar, dock, Mission Control, Spotlight, vsync frame scheduler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
tracing.workspace = true
os-core = { path = "../os-core" }
gpui = { workspace = true }
nx-compat = { path = "../nx-compat" }
nx-ui = { path = "../nx-ui" }
nx-wm = { path = "../nx-wm" }
nx-privacy-dash = { path = "../nx-privacy-dash" }
nx-power = { path = "../nx-power" }
nx-governor-policy = { path = "../nx-governor-policy" }
nx-fs = { path = "../nx-fs" }
nx-assistant = { path = "../nx-assistant" }
thiserror = { workspace = true }
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Globalization", "Win32_System_Time", "Win32_System_Power", "Win32_UI_TextServices", "Media_Control", "Foundation", "Foundation_Collections", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Wmi", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Rpc"] }
raw-window-handle.workspace = true

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "spotlight"
harness = false
