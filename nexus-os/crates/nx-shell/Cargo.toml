[package]
name = "nx-shell"
description = "Nexus-OS macOS-grade shell: menu bar, dock, Mission Control, Spotlight, vsync frame scheduler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
gpui = { workspace = true }
nx-compat = { path = "../nx-compat" }
nx-ui = { path = "../nx-ui" }
nx-wm = { path = "../nx-wm" }
nx-privacy-dash = { path = "../nx-privacy-dash" }
nx-power = { path = "../nx-power" }
nx-governor-policy = { path = "../nx-governor-policy" }
nx-fs = { path = "../nx-fs" }
nx-assistant = { path = "../nx-assistant" }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Globalization", "Win32_System_Time", "Win32_System_Power", "Win32_UI_TextServices", "Media_Control", "Foundation", "Foundation_Collections"] }

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "spotlight"
harness = false
