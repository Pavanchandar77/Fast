[package]
name = "nx-fs"
description = "Nexus-OS file-system engine: streaming listing, instant search index, previews, file ops"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
memchr = "2.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }

[dev-dependencies]
proptest = "1.5"
tempfile = "3.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "listing"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "index_memory"
harness = false
