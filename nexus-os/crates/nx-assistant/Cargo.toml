[package]
name = "nx-assistant"
description = "Nexus-OS on-device assistant: local LLM, validated desktop tools, opt-in web search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
candle-core = "0.11"
candle-transformers = "0.11"
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
os-core = { path = "../os-core" }
nexus-model = { path = "../nexus-model" }
windows = { workspace = true, features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Shutdown", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_Devices_Display", "Win32_Graphics_Gdi"] }
