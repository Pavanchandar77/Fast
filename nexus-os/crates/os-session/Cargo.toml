[package]
name = "os-session"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "nexus-os"
path = "src/main.rs"

[[bin]]
name = "nexus-watchdog"
path = "src/bin/watchdog.rs"

[[bin]]
name = "nexus-governor"
path = "src/bin/governor_daemon.rs"

[[bin]]
name = "nexus-compositor"
path = "src/bin/compositor_daemon.rs"

[[bin]]
name = "nexus-vfs"
path = "src/bin/vfs_daemon.rs"

[lib]
name = "os_session"
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
anyhow.workspace = true
tracing.workspace = true
nx-shell = { path = "../nx-shell" }
nx-explorer-ui = { path = "../nx-explorer-ui" }
nx-privacy-dash = { path = "../nx-privacy-dash" }
nx-power = { path = "../nx-power" }
nx-privacy = { path = "../nx-privacy" }
nx-ui = { path = "../nx-ui" }
nx-wm = { path = "../nx-wm" }

[target.'cfg(windows)'.dependencies]
nexus-journal = { path = "../nexus-journal" }
nx-compat = { path = "../nx-compat" }
os-core = { path = "../os-core" }
os-config = { path = "../os-config" }
os-governor = { path = "../os-governor" }
os-compositor = { path = "../os-compositor" }
os-vfs = { path = "../os-vfs" }
os-shield = { path = "../os-shield" }
tracing-subscriber.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
windows.workspace = true
