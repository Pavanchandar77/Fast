[package]
name = "nx-power"
description = "Nexus-OS power-user features: clipboard history, always-on-top, snapping layouts, quick look session, color picker, batch rename, key remap, per-app volume, quick notes, window tabs, alt-tab"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nx-fs = { path = "../nx-fs" }
serde = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
regex = "1.13"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
os-core = { path = "../os-core" }
nexus-model = { path = "../nexus-model" }

[dev-dependencies]
proptest = "1.5"
