[workspace]
resolver = "2"
members = [
    "crates/nexus-journal",
    "crates/nexus-model",
    "crates/os-core",
    "crates/os-config",
    "crates/os-governor",
    "crates/os-compositor",
    "crates/os-vfs",
    "crates/os-shield",
    "crates/os-hal",
    "crates/os-session",
    "crates/nx-fs",
    "crates/nx-explorer",
    "crates/nx-governor-policy",
    "crates/nx-wm",
    "crates/nx-privacy",
    "crates/nx-ui",
    "crates/nx-privacy-dash",
    "crates/nx-power",
    "crates/nx-explorer-ui",
    "crates/nx-shell",
    "crates/nx-compat",
    "crates/nx-assistant",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nexus-OS Core Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nx-compat = { path = "crates/nx-compat" }
nexus-journal = { path = "crates/nexus-journal" }
nexus-model = { path = "crates/nexus-model" }
nx-governor-policy = { path = "crates/nx-governor-policy" }
proptest = "1.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
notify = "6.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "1.0"
anyhow = "1.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectComposition",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_Console",
] }
wgpu = "24.0"
bytemuck = { version = "1.16", features = ["derive"] }
raw-window-handle = "0.6"
gpui = { version = "0.2.2", features = ["test-support"] }

[patch.crates-io]
xattr = { path = "patches/xattr" }
gpui = { path = "patches/gpui" }

# The on-device assistant runs a quantized LLM on CPU; keep its math hot even
# in dev builds so the island answers in real time.
[profile.dev.package.nx-assistant]
opt-level = 3
[profile.dev.package.candle-core]
opt-level = 3
debug = 0
[profile.dev.package.candle-nn]
opt-level = 3
debug = 0
[profile.dev.package.candle-transformers]
opt-level = 3
debug = 0
[profile.dev.package.gemm]
opt-level = 3
debug = 0
[profile.dev.package.gemm-common]
opt-level = 3
debug = 0
[profile.dev.package.gemm-f32]
opt-level = 3
debug = 0
[profile.dev.package.gemm-f16]
opt-level = 3
debug = 0
[profile.dev.package.half]
opt-level = 3
debug = 0
